# viewer-core - image IO and data layer: decoding, EXIF, resizing, the
# thumbnail/full-image cache, and directory scanning. Owns everything between
# the filesystem and an in-memory decoded image; no widgets or app state.
[package]
version.workspace = true
name = "viewer-core"
description.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
libcosmic.workspace = true
fast_image_resize.workspace = true
image.workspace = true
gif = "0.14.2"
kamadak-exif.workspace = true
libheif-rs.workspace = true
lru.workspace = true
moxcms = "0.8.1"
png = "0.18.1"
tempfile = "3"
tiff = "0.11.3"
rayon.workspace = true
resvg.workspace = true
turbojpeg.workspace = true
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }

viewer-config = { path = "../viewer-config" }

thiserror.workspace = true
tokio.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[lints]
workspace = true
